# ProERP sürüm yayın akışı.
#
# Tetikleme:
#   1) v* etiketi (ör. v1.0.1) push'u — `npm run release -- patch --push`
#      etiketi oluşturup iter; buradan sonrası tamamen otomatiktir:
#      testler → derleme → Windows kurulum paketi → GitHub Release
#      (latest.yml + blockmap + SHA-512) → masaüstü istemciler güncellemeyi görür.
#   2) Elle (workflow_dispatch) — mevcut bir etiketi yeniden yayınlar (bozuk
#      veya yarım kalmış yayını onarmak için). Etiketin var olması gerekir.
#
# Yayın yöntemi: electron-builder `--publish never` ile YALNIZCA yerel dosya
# üretir; GitHub Release tek bir deterministik `gh release create` adımıyla
# oluşturulur. Tek yayıncı, electron-builder'ın paralel yükleme yarışıyla
# aynı etikete çift release oluşturmasını yapısal olarak engeller.
#
# Kod imzalama (opsiyonel): repo secrets'a CSC_LINK (PFX base64) ve
# CSC_KEY_PASSWORD eklendiğinde electron-builder otomatik imzalar;
# eklenmemişse derleme uyarıyla imzasız devam eder (zorunlu tutulmaz).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

# Tüm release işleri seri koşar: iki tetikleme (ör. push + elle) aynı anda
# iki yayıncı başlatıp birbirinin release'ini ezemez.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sürüm ve etiket belirle
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Yayınlanacak etiket: $TAG"

      - name: Sürüm tutarlılık kontrolü (etiket = package.json)
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Etiket ($VERSION) ile package.json sürümü ($PKG_VERSION) eşleşmiyor."
            exit 1
          fi
          echo "Sürüm tutarlı: $VERSION"

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip denetimi (lint)
        run: npm run lint

      - name: Birim testleri
        run: npm test

      - name: Derleme + masaüstü sahneliği
        run: npm run desktop:build

      - name: Windows kurulum paketini oluştur (yayın yok)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          ARGS=""
          NOTES_FILE="release-notes/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            ARGS="-c.releaseInfo.releaseNotesFile=$NOTES_FILE"
            echo "Sürüm notları kullanılıyor: $NOTES_FILE"
          else
            echo "::warning::Sürüm notu dosyası yok ($NOTES_FILE); release notu boş olacak."
          fi
          npx electron-builder --win --x64 --publish never $ARGS
          for f in "release/ProERP-Setup-$VERSION.exe" "release/ProERP-Setup-$VERSION.exe.blockmap" "release/latest.yml"; do
            if [ ! -f "$f" ]; then
              echo "::error::Beklenen dosya üretilmedi: $f"
              exit 1
            fi
          done
          echo "Kurulum paketi ve güncelleme dosyaları hazır."

      - name: GitHub Release'i yayınla (tek yayıncı, deterministik)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Aynı etikette eski release'ler varsa (eski yarış kalıntısı) önce temizle.
          OLD_IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate -q ".[] | select(.tag_name == \"$TAG\") | .id")
          for id in $OLD_IDS; do
            echo "Eski release siliniyor: $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          NOTES_ARG=()
          if [ -f "release-notes/$TAG.md" ]; then
            NOTES_ARG=(--notes-file "release-notes/$TAG.md")
          else
            NOTES_ARG=(--notes "ProERP $VERSION")
          fi

          gh release create "$TAG" \
            "release/ProERP-Setup-$VERSION.exe" \
            "release/ProERP-Setup-$VERSION.exe.blockmap" \
            "release/latest.yml" \
            --verify-tag \
            --title "ProERP $VERSION" \
            "${NOTES_ARG[@]}"
          echo "Release yayınlandı: $TAG"
