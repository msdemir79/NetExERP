<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>ProERP — Hata</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 28px;
  }
  .card {
    width: 100%; max-width: 620px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 28px 30px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .icon {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    background: #7f1d1d;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  h1 { font-size: 19px; font-weight: 800; }
  .detail {
    background: #0b1220;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px 16px;
    font: 600 12.5px/1.65 "Consolas", "Segoe UI", monospace;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 240px; overflow: auto;
    margin-bottom: 18px;
  }
  .hint { font-size: 12.5px; color: #94a3b8; margin-bottom: 22px; line-height: 1.6; }
  .hint b { color: #e2e8f0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1; min-width: 130px;
    font: 700 13.5px "Segoe UI", sans-serif;
    padding: 11px 16px; border-radius: 9px; cursor: pointer;
    border: 1px solid #334155;
    background: #273449; color: #e2e8f0;
    transition: background 0.15s;
  }
  button:hover { background: #324158; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #ffffff; }
  button.primary:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="icon">&#9888;</div>
      <h1 id="message">Bir sorun oluştu</h1>
    </div>
    <div class="detail" id="detail"></div>
    <div class="hint" id="hint">
      Ayrıntılı teknik bilgi kayıtlarda (günlüklerde) tutulur; burada yalnız özet gösterilir.
    </div>
    <div class="actions">
      <button id="btnRetry" class="primary">Yeniden Dene</button>
      <button id="btnSettings">Ayarlar</button>
      <button id="btnLogs">Günlükleri Aç</button>
    </div>
  </div>
  <script>
    var app = window.proerpApp || {};

    function setText(id, text) {
      var el = document.getElementById(id);
      if (el) el.textContent = text || '';
    }

    if (typeof app.getStatus === 'function') {
      app.getStatus().then(function (status) {
        var err = status && status.error;
        if (err) {
          setText('message', err.message || 'Bir sorun oluştu');
          setText('detail', err.detail || '');
          var hint = document.getElementById('hint');
          if (hint && status.logsDir) {
            var b = document.createElement('b');
            b.textContent = status.logsDir;
            hint.textContent = 'Günlük klasörü: ';
            hint.appendChild(b);
            hint.appendChild(document.createTextNode('.'));
          }
        }
      }).catch(function () { /* durum alınamadı */ });
    }

    document.getElementById('btnRetry').addEventListener('click', function () {
      if (typeof app.retry === 'function') app.retry();
    });
    document.getElementById('btnSettings').addEventListener('click', function () {
      if (typeof app.openSettings === 'function') app.openSettings();
    });
    document.getElementById('btnLogs').addEventListener('click', function () {
      if (typeof app.openLogs === 'function') app.openLogs();
    });
  </script>
</body>
</html>
