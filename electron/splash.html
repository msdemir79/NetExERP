<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>DMR Nexus ERP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    user-select: none;
    overflow: hidden;
  }
  .logo {
    width: 240px; height: auto;
    border-radius: 18px;
    object-fit: contain;
    background: #ffffff;
    padding: 14px 22px;
    box-shadow: 0 12px 40px rgba(37, 99, 235, 0.35);
  }
  .title { font-size: 26px; font-weight: 800; letter-spacing: 0.02em; }
  .title span { color: #60a5fa; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(96, 165, 250, 0.25);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status {
    font-size: 13px; font-weight: 600;
    color: #cbd5e1; /* okunur kontrast, silik gri değil */
    min-height: 20px; text-align: center; max-width: 340px;
  }
</style>
</head>
<body>
  <img class="logo" src="dmr-nexus-icon.png" alt="DMR Nexus ERP">
  <div class="title">DMR Nexus ERP</div>
  <div class="spinner"></div>
  <div id="status">Hazırlanıyor...</div>
  <script>
    if (window.proerpSplash && typeof window.proerpSplash.onStatus === 'function') {
      window.proerpSplash.onStatus(function (text) {
        document.getElementById('status').textContent = text;
      });
    }
  </script>
</body>
</html>
